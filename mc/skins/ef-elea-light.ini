# Midnight Commander true-colour skin based on Emacs ef-elea-light.
# Palette source: ef-themes 2.2.0 by Protesilaos Stavrou.

[skin]
    description = Ef Elea Light
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[aliases]
    Main = #edf5e2
    MainFg = #221321
    Dim = #e3e9d6
    Alt = #d0d7ca
    DimFg = #676470
    AltFg = #5f5f1f
    Active = #b0b7aa
    Inactive = #e0e2d0
    Border = #a5aaaf
    Region = #d9d2ef
    Highlight = #d0e7c4
    Completion = #c2e4ba
    Popup = #e9efd1
    ModeLine = #a5c67f
    ModeLineFg = #142810
    Red = #c3303a
    RedWarm = #d00000
    RedFaint = #894852
    Green = #00601f
    GreenWarm = #355500
    GreenCool = #007047
    GreenFaint = #306630
    Yellow = #9a501f
    YellowWarm = #b04300
    Blue = #375cc6
    BlueCool = #162f8f
    Magenta = #80308f
    MagentaWarm = #9f356a
    MagentaCool = #5032aa
    MagentaFaint = #6a4a9f
    Cyan = #1f70af
    CyanCool = #00677f
    CyanFaint = #4f677f
    ErrorBg = #f2d5b5
    WarningBg = #e8e8aa
    AddedBg = #c7e8ba
    AddedRefine = #bed9b0
    AddedFg = #005000
    ChangedBg = #f5e8b0
    ChangedRefine = #f0db9a
    ChangedFg = #553d00
    RemovedBg = #f2d0c6
    RemovedRefine = #efbfbd
    RemovedFg = #8f1313

[core]
    _default_ = MainFg;Main
    selected = MainFg;Region
    marked = Magenta;;bold
    markselect = Magenta;Region;bold
    gauge = MainFg;ModeLine
    input = MainFg;Popup
    inputunchanged = DimFg;Popup
    inputmark = MainFg;Completion
    disabled = DimFg;Dim
    reverse = ModeLineFg;ModeLine
    commandlinemark = MainFg;Region
    header = GreenWarm;;bold
    shadow = DimFg;Active

[dialog]
    _default_ = MainFg;Dim
    dfocus = MainFg;Completion
    dhotnormal = MagentaWarm;;underline
    dhotfocus = MagentaWarm;Completion;underline
    dtitle = GreenWarm;;bold

[error]
    _default_ = RedWarm;ErrorBg
    errdfocus = MainFg;#ff8f88
    errdhotnormal = RedWarm;;underline
    errdhotfocus = RedWarm;#ff8f88;underline
    errdtitle = RedWarm;;bold

[filehighlight]
    directory = BlueCool;;bold
    executable = GreenCool
    symlink = Magenta
    hardlink = MagentaFaint
    stalelink = RedWarm
    device = Yellow
    special = RedFaint
    core = Red
    temp = DimFg
    archive = MagentaCool
    doc = CyanCool
    source = GreenWarm
    media = Cyan
    graph = MagentaWarm
    database = YellowWarm

[menu]
    _default_ = MainFg;ModeLine
    menusel = MainFg;Region
    menuhot = MagentaWarm;;underline
    menuhotsel = MagentaWarm;Region;underline
    menuinactive = DimFg;Inactive

[popupmenu]
    _default_ = MainFg;Popup
    menusel = MainFg;Completion
    menutitle = GreenWarm;;bold

[buttonbar]
    hotkey = MagentaWarm;ModeLine;bold
    button = ModeLineFg;ModeLine

[statusbar]
    _default_ = ModeLineFg;ModeLine

[help]
    _default_ = MainFg;Popup
    helpitalic = RedFaint;;italic
    helpbold = GreenWarm;;bold
    helplink = Green;;underline
    helpslink = Main;Green
    helptitle = GreenWarm;;bold

[editor]
    _default_ = MainFg;Main
    editbold = Magenta;;bold
    editmarked = MainFg;Region
    editwhitespace = Border;Main
    editnonprintable = RedWarm;Main
    editlinestate = ModeLineFg;ModeLine
    bookmark = MainFg;WarningBg
    bookmarkfound = MainFg;Completion
    editrightmargin = ;Dim
    editbg = ;Main
    editframe = Border
    editframeactive = GreenWarm
    editframedrag = Magenta

[viewer]
    _default_ = MainFg;Main
    viewbold = GreenWarm;;bold
    viewunderline = Green;;underline
    viewselected = MainFg;Region

[diffviewer]
    added = AddedFg;AddedBg
    changedline = ChangedFg;ChangedBg
    changednew = AddedFg;AddedRefine
    changed = ChangedFg;ChangedRefine
    removed = RemovedFg;RemovedBg
    error = RemovedFg;RemovedRefine

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
